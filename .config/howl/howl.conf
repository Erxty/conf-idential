win_step=25
win_step_big=50

howlc inner_border_width 4
howlc outer_border_width 4
howlc inner_focus_color 0d0d0d
howlc inner_unfocus_color efefef
howlc outer_focus_color efefef
howlc outer_unfocus_color 0d0d0d

sleep 0.1 && bar &
sleep 0.1 && wawa fill Pictures/Favourites/shrimpMade.jpg &

howlc modkey alt

howlc bind mod+a "st-wl"
howlc bind mod+f "qutebrowser"
howlc bind mod+d "neumenu_nice"

howlc bind mod+shift+a "ss"
howlc bind mod+shift+s "sss"

howlc bind mod+h "howlc move -${win_step} 0"
howlc bind mod+j "howlc move 0 ${win_step}"
howlc bind mod+k "howlc move 0 -${win_step}"
howlc bind mod+l "howlc move ${win_step} 0"

howlc bind win+h "howlc resize -${win_step} 0"
howlc bind win+j "howlc resize 0 ${win_step}"
howlc bind win+k "howlc resize 0 -${win_step}"
howlc bind win+l "howlc resize ${win_step} 0"

howlc bind mod+shift+h "howlc move -${win_step_big} 0"
howlc bind mod+shift+j "howlc move 0 ${win_step_big}"
howlc bind mod+shift+k "howlc move 0 -${win_step_big}"
howlc bind mod+shift+l "howlc move ${win_step_big} 0"

howlc bind win+shift+h "howlc resize -${win_step_big} 0"
howlc bind win+shift+j "howlc resize 0 ${win_step_big}"
howlc bind win+shift+k "howlc resize 0 -${win_step_big}"
howlc bind win+shift+l "howlc resize ${win_step_big} 0"

howlc bind mod+1 "howlc workspace 1"
howlc bind mod+2 "howlc workspace 2"
howlc bind mod+3 "howlc workspace 3"
howlc bind mod+4 "howlc workspace 4"
howlc bind mod+5 "howlc workspace 5"

howlc bind win+1 "howlc move_workspace 1"
howlc bind win+2 "howlc move_workspace 2"
howlc bind win+3 "howlc move_workspace 3"
howlc bind win+4 "howlc move_workspace 4"
howlc bind win+5 "howlc move_workspace 5"

howlc bind win+n "howlc lower"
howlc bind win+m "howlc raise"
howlc bind win+c "howlc center"
howlc bind win+f "howlc fullscreen"
howlc bind mod+q "howlc close"

howlc bind win+tab "howlc focus_next"
howlc bind win+shift+tab "howlc focus_prev"
howlc bind win+shift+q "howlc quit"
